<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تذكرة</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: 'Amiri', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }
    .profile-wrap { margin-bottom: 12px; animation: fadeDown 0.7s ease both; }
    .profile-img {
      width: 130px; height: 130px;
      border-radius: 50%; object-fit: cover;
      border: 3px solid #2a2a2a; display: block;
    }
    .handle {
      font-family: 'Scheherazade New', serif;
      font-size: 1.5rem; font-weight: 700;
      color: #1a1a1a; margin-bottom: 32px;
      letter-spacing: 0.02em;
      animation: fadeDown 0.7s ease 0.1s both;
    }
    .row {
      display: flex; gap: 14px;
      width: 100%; max-width: 460px;
      justify-content: center; margin-bottom: 14px;
    }
    .btn {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 22px; border-radius: 10px;
      text-decoration: none;
      font-family: 'Amiri', serif; font-size: 1.05rem; font-weight: 700;
      color: #ffffff; background: #1a1a1a;
      border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
      flex: 1; justify-content: center; cursor: pointer;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.22); background: #333; }
    .btn:active { transform: translateY(-1px); }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .row.full .btn { flex: none; width: 100%; }
    .btn.telegram:hover  { background: #229ed9; }
    .btn.instagram:hover { background: #c13584; }
    .btn.twitter:hover   { background: #000; }
    .btn.tiktok:hover    { background: #010101; }
    .btn.youtube:hover   { background: #ff0000; }
    .row:nth-child(1) { animation: fadeUp 0.65s ease 0.2s both; }
    .row:nth-child(2) { animation: fadeUp 0.65s ease 0.32s both; }
    .row:nth-child(3) { animation: fadeUp 0.65s ease 0.44s both; }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:none; } }
  </style>
</head>
